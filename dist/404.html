<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | Arunbh Yashaswi</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Montserrat', sans-serif;
      background: #1a1a1a;
      color: #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
    }
    .container { max-width: 500px; }
    h1 {
      font-size: 6rem;
      font-weight: 700;
      background: linear-gradient(to right, #08415c, #cc2936);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 1rem;
    }
    h2 {
      font-size: 1.5rem;
      font-weight: 500;
      margin-bottom: 1rem;
      color: #ffffff;
    }
    p {
      font-size: 1rem;
      margin-bottom: 2rem;
      opacity: 0.7;
    }
    a {
      display: inline-block;
      padding: 0.6rem 2rem;
      color: #cc2936;
      border: 2px solid #cc2936;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    a:hover {
      background: #cc2936;
      color: white;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>The page you're looking for doesn't exist or has been moved.</p>
    <a href="/">Back to Portfolio</a>
  </div>
</body>
</html>
